name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Apple silicon)
    # Apple-silicon hosted runner: the package targets macOS 14+ and the Metal and AVFoundation code paths need macOS.
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Select Xcode 27.0
        # The xcode-27 image's default Xcode (build 27A266a, the same build as the local toolchain). The image also
        # has 27.1 and 27.2 betas installed, so pin the default rather than the newest.
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app
          xcodebuild -version
          swift --version

      - name: Install ffmpeg
        # Enables the ffmpeg (libx264) encoder tests and the byte-identical movie check; without it those tests are skipped.
        run: |
          brew install ffmpeg
          ffmpeg -hide_banner -version | head -n 1
          ffmpeg -hide_banner -encoders | grep -q libx264

      - name: Cache SwiftPM and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-

      - name: Build (release)
        run: swift build -c release

      - name: Test
        # A healthy run takes about 11 minutes; a hung test process once held the job for the full hour.
        timeout-minutes: 25
        run: swift test
