name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Apple silicon)
    # Apple-silicon hosted runner: the package targets macOS 14+ and the Metal and AVFoundation code paths need macOS.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          swift --version

      - name: Install ffmpeg
        # Enables the ffmpeg (libx264) encoder tests and the byte-identical movie check; without it those tests are skipped.
        run: |
          brew install ffmpeg
          ffmpeg -hide_banner -version | head -n 1
          ffmpeg -hide_banner -encoders | grep -q libx264

      - name: Cache SwiftPM and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test
